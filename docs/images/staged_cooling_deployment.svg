<text x="56" y="531" font-size="22" class="teal" text-anchor="start">02  COAST — RECOVER GAS, ISOLATE STORAGE, THEN OPEN HATCHES</text>
<text x="56" y="562" font-size="18" class="muted" text-anchor="start">All four racks remain attached; sheets unfold outside to radiate their stored heat.</text>
