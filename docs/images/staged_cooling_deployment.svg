<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1020" viewBox="0 0 1440 1020" role="img" aria-labelledby="title desc">
<title id="title">Staged cooling: capture with sealed hatches, radiate during coast</title>
<desc id="desc">Four metal cooling racks alternate with compressor blocks. Local pressure-retaining hatches stay closed during collection. During coast, recover chamber gas, isolate the aft storage tank, depressurize cooling chambers, then open hatches and deploy attached metal sheets. The aft tank remains sealed. Schematic, not to scale.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#75e4d0"/></marker><marker id="heat" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#ffc36b"/></marker><pattern id="mesh" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 0L12 12M12 0L0 12" stroke="#ffc36b" stroke-width="1"/></pattern></defs>
<rect width="1440" height="1020" rx="20" fill="#0b1424"/>
<style>text{font-family:DejaVu Sans,sans-serif;fill:#eef5ff} .muted{fill:#a9bfd3} .gold{fill:#ffc36b} .teal{fill:#75e4d0}</style>
<text x="48" y="58" font-size="30" class="" text-anchor="start">ONE GAS PATH • FOUR REUSABLE METAL HEAT STORES</text>
<text x="48" y="94" font-size="20" class="muted" text-anchor="start">Compressor blocks alternate with cooling chambers. Each rack has a local deployment route.</text>
<rect x="32" y="122" width="1376" height="348" rx="5" fill="#101e30" stroke="none" stroke-width="2"/>
<text x="56" y="162" font-size="22" class="teal" text-anchor="start">01  COLLECT — HATCHES CLOSED AND PRESSURE-RETAINING</text>
<text x="56" y="195" font-size="18" class="muted" text-anchor="start">Open inlet → shock / diffuser → cooling rack → compressor → repeat → aft storage</text>
