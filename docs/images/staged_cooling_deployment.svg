<text x="55" y="955" font-size="18" class="gold" text-anchor="start">Retract cooled racks, close and latch hatches, verify seals, then repeat the dive.</text>
<text x="55" y="987" font-size="16" class="muted" text-anchor="start">Layout schematic; areas and chamber sizes not to scale. Solar arrays and warm-loop radiators remain separate systems.</text>
