<path d="M1312.0 258 V347" fill="none" stroke="#76b7ff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1004 287.6666666666667 H1356" fill="none" stroke="#76b7ff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1004 317.3333333333333 H1356" fill="none" stroke="#76b7ff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1180 360 V434" fill="none" stroke="#76b7ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<rect x="1040" y="447" width="280" height="78" rx="10" fill="#253f66" stroke="#76b7ff" stroke-width="2"/>
<text x="1180" y="480" fill="#76b7ff" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" text-anchor="middle">Battery storage</text>
<text x="1180" y="508" fill="#a9bfd3" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Recharge in the coast</text>
<path d="M1180 537 V582" fill="none" stroke="#76b7ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<text x="1022" y="617" fill="#eef5ff" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" text-anchor="start">Powers the next dive:</text>
<text x="1022" y="648" fill="#eef5ff" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" text-anchor="start">compressors + air-fed thrusters</text>
<text x="1022" y="679" fill="#eef5ff" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" text-anchor="start">Coast power also runs liquefaction.</text>
<path d="M1002 302 H948 V427 H882" fill="none" stroke="#76b7ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<text x="949" y="375" fill="#76b7ff" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">Work</text>
<text x="55" y="778" fill="#a9bfd3" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" text-anchor="start">Energy-flow schematic • sizes are illustrative • radiator temperatures, working-fluid regime and deployment hardware need engineering.</text>
</svg>
