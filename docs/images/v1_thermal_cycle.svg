<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800" role="img" aria-labelledby="title desc"><title id="title">Three deployed systems and the heat and electrical cycle</title><desc id="desc">Solid metal absorbs heat during the dive and radiates directly during coast. A separate warm fluid radiator rejects refrigerator, compressor and electrical heat. Solar arrays provide coast electricity and recharge batteries for the next pass. Cryogenic product heat exchange and the electrically driven refrigerator are distinct blocks.</desc>
<rect width="1440" height="800" rx="22" fill="#0b1424"/>
<defs>
<marker id="gas" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#ff9969"/></marker>
<marker id="heat" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#ffc36b"/></marker>
<marker id="blue" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#76b7ff"/></marker>
<marker id="teal" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#75e4d0"/></marker>
<marker id="muted" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#91afc8"/></marker>
<marker id="purple" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#c8b5ff"/></marker>
<linearGradient id="hot"><stop stop-color="#7c342c"/><stop offset="1" stop-color="#a96831"/></linearGradient><linearGradient id="air"><stop stop-color="#462b30"/><stop offset="1" stop-color="#b75b3b"/></linearGradient></defs>
<text x="55" y="65" fill="#eef5ff" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="bold" text-anchor="start">THREE DEPLOYED SYSTEMS, THREE DIFFERENT JOBS</text>
<text x="55" y="104" fill="#a9bfd3" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="start">The entry heat store, the warm heat-rejection loop and the electrical supply are separate budgets.</text>
<rect x="60" y="147" width="400" height="590" rx="10" fill="#14243a" stroke="none" stroke-width="2"/>
<text x="82" y="185" fill="#ffc36b" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="bold" text-anchor="start">01</text>
<text x="82" y="218" fill="#ffc36b" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="bold" text-anchor="start">SOLID HEAT ABSORBER</text>
<rect x="520" y="147" width="400" height="590" rx="10" fill="#14243a" stroke="none" stroke-width="2"/>
<text x="542" y="185" fill="#75e4d0" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="bold" text-anchor="start">02</text>
<text x="542" y="218" fill="#75e4d0" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="bold" text-anchor="start">WARM THERMAL LOOP</text>
<rect x="980" y="147" width="400" height="590" rx="10" fill="#14243a" stroke="none" stroke-width="2"/>
<text x="1002" y="185" fill="#76b7ff" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="bold" text-anchor="start">03</text>
<text x="1002" y="218" fill="#76b7ff" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="bold" text-anchor="start">SOLAR + BATTERIES</text>
<rect x="84" y="250" width="352" height="115" rx="10" fill="#563d30" stroke="#ffc36b" stroke-width="2"/>
<text x="105" y="284" fill="#eef5ff" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Incoming gas loses heat</text>
<text x="105" y="313" fill="#eef5ff" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Rack stores entry heat</text>
<text x="105" y="342" fill="#eef5ff" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Energy stored in the solid</text>
<path d="M260 376 V439" fill="none" stroke="#ffc36b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#heat)"/>
<text x="280" y="409" fill="#a9bfd3" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" text-anchor="start">During coast</text>
<path d="M105 470 L354 454 L412 478 L163 494 Z" fill="#70472e" stroke="#ffc36b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M105 496 L354 480 L412 504 L163 520 Z" fill="#70472e" stroke="#ffc36b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M105 522 L354 506 L412 530 L163 546 Z" fill="#70472e" stroke="#ffc36b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M166 575 V624" fill="none" stroke="#ffc36b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#heat)"/>
<path d="M260 575 V624" fill="none" stroke="#ffc36b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#heat)"/>
<path d="M353 575 V624" fill="none" stroke="#ffc36b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#heat)"/>
<text x="260" y="657" fill="#ffc36b" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" text-anchor="middle">Direct radiation to space</text>
<text x="260" y="694" fill="#a9bfd3" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Cooler stays attached and is reused.</text>
<rect x="544" y="250" width="352" height="93" rx="10" fill="#1c4250" stroke="#75e4d0" stroke-width="2"/>
<text x="563" y="281" fill="#75e4d0" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Product condenser / exchanger</text>
<text x="563" y="314" fill="#eef5ff" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" text-anchor="start">Gas → useful cryogenic liquid</text>
<path d="M720 349 V386" fill="none" stroke="#ffc36b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#heat)"/>
<rect x="564" y="391" width="312" height="73" rx="10" fill="#323c55" stroke="#c8b5ff" stroke-width="2"/>
<text x="720" y="421" fill="#c8b5ff" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" text-anchor="middle">Refrigerator / heat pump</text>
<text x="720" y="446" fill="#a9bfd3" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Cold lift requires electricity</text>
<path d="M720 472 V554" fill="none" stroke="#ffc36b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#heat)"/>
<text x="738" y="512" fill="#ffc36b" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" text-anchor="start">Heat + work</text>
<rect x="544" y="565" width="352" height="67" rx="3" fill="#5a3932" stroke="#ffc36b" stroke-width="2"/>
<path d="M583 573 V624" fill="none" stroke="#ffc36b" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M622 573 V624" fill="none" stroke="#ffc36b" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M661 573 V624" fill="none" stroke="#ffc36b" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M700 573 V624" fill="none" stroke="#ffc36b" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M739 573 V624" fill="none" stroke="#ffc36b" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M778 573 V624" fill="none" stroke="#ffc36b" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M817 573 V624" fill="none" stroke="#ffc36b" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M856 573 V624" fill="none" stroke="#ffc36b" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="720" y="657" fill="#ffc36b" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="normal" text-anchor="middle">Warm fluid radiator → space</text>
<text x="720" y="694" fill="#a9bfd3" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">Also serves warm process / electrical loads.</text>
<rect x="1004" y="258" width="352" height="89" rx="3" fill="#16395a" stroke="#76b7ff" stroke-width="2"/>
<path d="M1048.0 258 V347" fill="none" stroke="#76b7ff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1092.0 258 V347" fill="none" stroke="#76b7ff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1136.0 258 V347" fill="none" stroke="#76b7ff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
