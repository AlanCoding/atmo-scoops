<text x="55" y="89" font-size="21" text-anchor="start" fill="#203344">v1.0 geometry • revised stowage and propellant partition • numerical cycle update pending</text>
<text x="55" y="135" font-size="23" text-anchor="start" fill="#203344">85 km perigee   |   85 × 2,000 km reference orbit   |   all deployables stowed</text>
