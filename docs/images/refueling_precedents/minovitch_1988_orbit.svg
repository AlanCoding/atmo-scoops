<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img"><title>MINOVITCH · 1988 | Capture while descending</title><desc>A nuclear-electric transfer vehicle collects air as atmospheric drag lowers its return-orbit apogee.</desc><defs>
