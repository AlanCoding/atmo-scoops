<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img"><title>SLOUGH · 2022 | Refueling Orbital Navigator</title><desc>Repeated collection with perigee drag compensation — a different design from the 2026 Space Gas Station.</desc><defs>
