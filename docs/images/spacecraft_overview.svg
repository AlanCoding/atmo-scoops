<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1020" viewBox="0 0 1440 1020" role="img" aria-labelledby="title desc"><title id="title">Atmospheric scoop diver: capture and coast</title><desc id="desc">Two operating states of the same open-mouth spacecraft. During the dive, the shock, metal rack and compressors feed rear tanks while batteries power oxygen propulsion. During coast, attached metal sheets, solar arrays and separate warm radiators deploy. Conceptual layout, not to scale.</desc>
