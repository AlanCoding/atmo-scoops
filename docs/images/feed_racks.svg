<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">Scoop gas reserve and independently spaced cooling racks</title>
<desc id="desc">Five gas volumes with flow-aligned parallel plates and four dive compressors feed a coast compressor. Its output splits between liquid production and a booster feeding four gas reserve tanks for the next burn.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7" fill="#319ac0"/></marker></defs>
<rect width="1200" height="660" fill="#102132"/>
<g font-family="sans-serif" fill="#e6eef5"><text x="35" y="42" font-size="26">Two destinations for captured air</text><text x="35" y="70" font-size="16" fill="#a7bed0">Flow schematic • fixed 30 m bore / 317 m hull length • component sizes below are not to scale</text>
<g stroke="#779ab3" stroke-width="2" fill="#1b354a"><rect x="55" y="115" width="150" height="140" rx="10"/><rect x="230" y="115" width="145" height="140" rx="10"/><rect x="400" y="115" width="145" height="140" rx="10"/><rect x="570" y="115" width="145" height="140" rx="10"/><rect x="740" y="115" width="400" height="140" rx="10"/></g>
<g font-size="17" text-anchor="middle"><text x="128" y="144">Front / SiC</text><text x="302" y="144">Stage 2 / Al</text><text x="472" y="144">Stage 3 / Al</text><text x="642" y="144">Stage 4 / Al</text><text x="930" y="144">Aft receiver / Al</text></g>
<g stroke="#edab52" stroke-width="4"><path d="M160 165h35 M160 183h35 M160 207h35 M160 225h35 M330 165h35 M330 183h35 M330 207h35 M330 225h35 M500 165h35 M500 183h35 M500 207h35 M500 225h35 M670 165h35 M670 183h35 M670 207h35 M670 225h35 M1085 165h35 M1085 183h35 M1085 207h35 M1085 225h35"/></g>
<g fill="none" stroke="#319ac0" stroke-width="3" marker-end="url(#arrow)"><path d="M15 195H150 M195 195H245 M365 195H415 M535 195H585 M705 195H755 M1120 195H1165V310H950"/></g>
<g fill="#68c9cc" font-size="14" text-anchor="middle"><text x="218" y="282">C1</text><text x="388" y="282">C2</text><text x="558" y="282">C3</text><text x="728" y="282">C4</text></g>
<text x="55" y="308" font-size="16" fill="#edab52">Gold: flow-aligned plates; friction is charged as compressor electricity.</text>
<rect x="715" y="330" width="230" height="65" rx="9" fill="#264b63" stroke="#68c9cc"/><text x="830" y="357" text-anchor="middle" font-size="18">Coast compressor</text><text x="830" y="381" text-anchor="middle" font-size="15">3 cooled blocks → ~1 bar</text>
<path d="M950 310H830V330 M830 395V425H1025V448 M830 425H580V448" fill="none" stroke="#319ac0" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="910" y="450" width="235" height="70" rx="9" fill="#264b63"/><text x="1028" y="478" text-anchor="middle" font-size="18">Liquefier → products</text><text x="1028" y="502" text-anchor="middle" font-size="14">Only this branch becomes liquid</text>
<rect x="465" y="450" width="230" height="70" rx="9" fill="#264b63"/><text x="580" y="478" text-anchor="middle" font-size="18">Booster + aftercooler</text><text x="580" y="502" text-anchor="middle" font-size="14">Gas remains unseparated</text>
<path d="M465 485H360 M210 520V565H580" fill="none" stroke="#319ac0" stroke-width="3" marker-end="url(#arrow)"/>
<g fill="#264b63" stroke="#68c9cc" stroke-width="2"><circle cx="120" cy="485" r="34"/><circle cx="185" cy="485" r="34"/><circle cx="250" cy="485" r="34"/><circle cx="315" cy="485" r="34"/></g>
<text x="215" y="425" text-anchor="middle" font-size="17">Four gas-reserve spheres</text><text x="215" y="445" text-anchor="middle" font-size="14">6.25 m OD each / 500 m³ total / 15 bar rating</text>
<text x="600" y="571" font-size="18">Regulator → thrusters on next pass</text>
<path d="M215 525V615H580V520 M580 615H1000" fill="none" stroke="#edab52" stroke-width="2" stroke-dasharray="8 5"/><text x="655" y="640" text-anchor="middle" font-size="15" fill="#edab52">Tank jackets and aftercooler share the existing warm rejection loop</text>
<text x="55" y="350" font-size="14" fill="#a7bed0">Rack planes retract through separate pressure hatches</text><text x="55" y="371" font-size="14" fill="#a7bed0">and spread for coast radiation; reserve tanks stay sealed.</text>
</g></svg>
